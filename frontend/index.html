<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Marketplace — buy & sell on campus</title>
  <meta name="description" content="Buy and sell used books, calculators, lab gear and hostel essentials with students on your campus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232340A8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ECM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="hero">
      <div class="container">
        <h1>Second-hand, <span class="scribble">first-class</span> deals on campus</h1>
        <p>Textbooks, calculators, lab coats, kettles and more — from students who don't need them any more.</p>
        <form class="search-bar" id="search-form" role="search">
          <input type="search" id="q" name="q" placeholder="Search “calculator”, “HC Verma”, “mattress”…" aria-label="Search items">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
      </div>
    </section>

    <div class="container browse">
      <aside class="sidebar panel" id="sidebar" aria-label="Filters">
        <h3>Categories</h3>
        <ul class="cat-list" id="cat-list"><li class="muted small">Loading…</li></ul>

        <h3>Price (₹)</h3>
        <form id="price-form">
          <div class="price-range">
            <input type="number" id="min" min="0" placeholder="Min" aria-label="Minimum price">
            <input type="number" id="max" min="0" placeholder="Max" aria-label="Maximum price">
          </div>
          <button class="btn btn-sm btn-block" type="submit" style="margin-top:8px">Apply price</button>
        </form>

        <h3>Status</h3>
        <label class="checkbox"><input type="checkbox" id="include-sold"> Show sold items</label>

        <button class="btn btn-sm btn-block" id="clear-filters" type="button" style="margin-top:18px">Clear all filters</button>
      </aside>

      <section aria-live="polite">
        <div class="toolbar">
          <div>
            <h2 id="results-title" style="margin:0">All items</h2>
            <span class="muted small" id="results-count"></span>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-sm filter-toggle" id="filter-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Filters</button>
            <label for="sort" class="small muted" style="margin:0">Sort</label>
            <select id="sort">
              <option value="newest">Newest first</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
            </select>
          </div>
        </div>
        <div id="error" hidden></div>
        <div class="grid" id="grid"><div class="loading">Loading items…</div></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
