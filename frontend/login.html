<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Campus Marketplace</title>
  <meta name="description" content="Buy and sell used books, calculators, lab gear and hostel essentials with students on your campus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232340A8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ECM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="auth-wrap">
      <div class="panel">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
          <button class="tab" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">Create account</button>
        </div>
        <div id="error" hidden></div>

        <form id="login-form" role="tabpanel" aria-labelledby="tab-login">
          <div class="field"><label for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
          <p class="hint" style="margin-top:14px">Demo accounts: <strong>aarav@campus.edu</strong> or <strong>priya@campus.edu</strong>, password <strong>password123</strong></p>
        </form>

        <form id="register-form" role="tabpanel" aria-labelledby="tab-register" hidden>
          <div class="field"><label for="reg-name">Full name</label>
            <input id="reg-name" autocomplete="name" required minlength="2" maxlength="80"></div>
          <div class="field"><label for="reg-email">College email</label>
            <input id="reg-email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="reg-phone">Phone <span class="muted small">(optional, shown to logged-in buyers)</span></label>
            <input id="reg-phone" type="tel" autocomplete="tel" maxlength="20"></div>
          <div class="field"><label for="reg-password">Password</label>
            <input id="reg-password" type="password" autocomplete="new-password" required minlength="6">
            <div class="hint">At least 6 characters.</div></div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
