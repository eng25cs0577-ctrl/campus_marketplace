<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell an item — Campus Marketplace</title>
  <meta name="description" content="Buy and sell used books, calculators, lab gear and hostel essentials with students on your campus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232340A8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ECM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="narrow">
      <h1>Sell an item</h1>
      <p class="muted">Add a clear photo and an honest description — items with photos sell faster.</p>
      <form class="panel" id="sell-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" required minlength="3" maxlength="120" placeholder="e.g. Casio fx-991ES Plus calculator">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="category_id">Category</label>
            <select id="category_id" name="category_id" required><option value="">Choose…</option></select>
          </div>
          <div class="field">
            <label for="price">Price (₹)</label>
            <input id="price" name="price" type="number" min="0" step="1" required placeholder="500">
          </div>
        </div>
        <div class="field">
          <label for="item_condition">Condition</label>
          <select id="item_condition" name="item_condition">
            <option>New</option><option>Like new</option><option selected>Good</option><option>Fair</option><option>Worn</option>
          </select>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" maxlength="2000" placeholder="Edition, how long you used it, any marks or defects, where to meet…"></textarea>
        </div>
        <div class="field">
          <label for="image">Photo <span class="muted small">(optional, max 3 MB)</span></label>
          <div class="upload-box">
            <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
            <img id="preview" class="preview" alt="Photo preview" hidden>
            <button class="btn btn-sm" type="button" id="remove-photo" hidden style="margin-top:10px">Remove photo</button>
          </div>
        </div>
        <div id="error" hidden></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Post item</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/sell.js"></script>
</body>
</html>
