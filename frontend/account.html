<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account — Campus Marketplace</title>
  <meta name="description" content="Buy and sell used books, calculators, lab gear and hostel essentials with students on your campus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232340A8'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ECM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div style="padding-top:28px">
      <h1 id="hello">My account</h1>
      <p class="muted" id="hello-sub"></p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="listings" aria-selected="true">My listings <span class="badge" id="badge-listings"></span></button>
        <button class="tab" role="tab" data-tab="wishlist" aria-selected="false">Wishlist <span class="badge" id="badge-wishlist"></span></button>
        <button class="tab" role="tab" data-tab="messages" aria-selected="false">Messages <span class="badge" id="badge-messages"></span></button>
      </div>
      <div id="error" hidden></div>
      <section id="panel-listings" role="tabpanel"><div class="loading">Loading…</div></section>
      <section id="panel-wishlist" role="tabpanel" hidden></section>
      <section id="panel-messages" role="tabpanel" hidden></section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
